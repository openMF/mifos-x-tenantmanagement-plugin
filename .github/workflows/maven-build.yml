name: Java CI with Maven

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  # Unit tests and formatting: the fast gate
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      - name: Run Unit Tests
        run: ./mvnw -B clean test --file pom.xml

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # Integration tests: real PostgreSQL, and Fineract in Docker with the plugin loaded
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      # Authenticate to Docker Hub to avoid anonymous pull rate limits, when secrets are set.
      - name: DockerHub Login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pre-pull Fineract Image
        run: docker pull apache/fineract:develop

      - name: Run Integration Tests
        run: ./mvnw -B clean verify -Dsurefire.skip=true --file pom.xml

      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7
